<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Background Box (Dark Brown Brand Color) -->
  <rect width="400" height="400" rx="80" fill="#2D241E"/>
  
  <!-- Stylized Cup / Inventory Box (Taller) -->
  <path d="M120 170 H280 L250 310 Q200 340 150 310 Z" fill="#F97316"/>
  
  <!-- Cup Rim -->
  <ellipse cx="200" cy="170" rx="80" ry="25" fill="#EDE5DB"/>
  
  <!-- Coffee Liquid -->
  <ellipse cx="200" cy="170" rx="65" ry="15" fill="#2D241E"/>
  
  <!-- Steam Lines (More dynamic and natural curves) -->
  <!-- Left Steam -->
  <path d="M160 120 C140 90 180 70 160 40" stroke="#F97316" stroke-width="12" stroke-linecap="round" fill="none"/>
  
  <!-- Middle Steam (Taller and slightly thicker) -->
  <path d="M200 130 C180 90 220 70 200 30" stroke="#F97316" stroke-width="14" stroke-linecap="round" fill="none"/>
  
  <!-- Right Steam -->
  <path d="M240 120 C220 90 260 70 240 40" stroke="#F97316" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>